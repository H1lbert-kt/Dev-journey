<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer - DevJourney</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-base);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .popup-container {
            text-align: center;
            padding: 24px;
            width: 100%;
            max-width: 320px;
        }
        .popup-subject {
            font-size: 14px;
            color: var(--fg-2);
            margin-bottom: 8px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .popup-time {
            font-size: 56px;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent);
            line-height: 1.1;
            margin-bottom: 8px;
        }
        .popup-status {
            font-size: 13px;
            color: var(--fg-3);
            margin-bottom: 20px;
        }
        .popup-status.running { color: var(--green); }
        .popup-status.paused { color: var(--yellow); }
        .popup-status.stopped { color: var(--fg-3); }
        .popup-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .popup-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
        }
        .popup-btn:hover { transform: scale(1.08); }
        .popup-btn-play {
            background: var(--green);
            color: #0c0e12;
        }
        .popup-btn-pause {
            background: var(--yellow);
            color: #0c0e12;
        }
        .popup-btn-stop {
            background: var(--red);
            color: #0c0e12;
        }
        .popup-idle {
            color: var(--fg-3);
            font-size: 14px;
            padding: 40px 0;
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <div id="popup-active" style="display:none">
            <div class="popup-subject" id="popup-subject"></div>
            <div class="popup-time" id="popup-time">00:00:00</div>
            <div class="popup-status" id="popup-status"></div>
            <div class="popup-controls">
                <button class="popup-btn popup-btn-play" id="popup-play" onclick="sendCommand('resume')">&#9654;</button>
                <button class="popup-btn popup-btn-pause" id="popup-pause" onclick="sendCommand('pause')" style="display:none">||</button>
                <button class="popup-btn popup-btn-stop" onclick="sendCommand('stop')">&#9632;</button>
            </div>
        </div>
        <div class="popup-idle" id="popup-idle">
            Nenhum cronômetro ativo.<br>Inicie o cronômetro na página principal.
        </div>
    </div>
    <script>
    var popupSeconds = 0;
    var popupRunning = false;
    var popupSubject = '';
    var popupStartTime = 0;
    var popupInterval = null;
    var channel = null;

    function popupCalcSeconds() {
        if (!popupRunning || popupStartTime <= 0) return popupSeconds;
        return Math.floor((Date.now() - popupStartTime) / 1000);
    }

    function popupStartLoop() {
        popupStopLoop();
        function tick() {
            if (!popupRunning) return;
            var newSec = popupCalcSeconds();
            if (newSec !== popupSeconds) {
                popupSeconds = newSec;
                updatePopupDisplay();
            }
        }
        tick();
        popupInterval = setInterval(tick, 1000);
    }

    function popupStopLoop() {
        if (popupInterval) {
            clearInterval(popupInterval);
            popupInterval = null;
        }
    }

    if (typeof BroadcastChannel !== 'undefined') {
        channel = new BroadcastChannel('devjourney-timer');
        channel.onmessage = function(e) {
            if (e.data.type === 'state') {
                popupSeconds = e.data.seconds || 0;
                popupRunning = e.data.running || false;
                popupSubject = e.data.subject || '';
                popupStartTime = e.data.startTime || 0;
                if (popupRunning && popupStartTime > 0) {
                    popupSeconds = popupCalcSeconds();
                    popupStartLoop();
                } else {
                    popupStopLoop();
                }
                updatePopupDisplay();
            } else if (e.data.type === 'stop') {
                popupSeconds = 0;
                popupRunning = false;
                popupSubject = '';
                popupStartTime = 0;
                popupStopLoop();
                updatePopupDisplay();
            }
        };
    }

    function sendCommand(cmd) {
        if (channel) {
            channel.postMessage({type: 'command', action: cmd});
        } else {
            var state = {};
            try { state = JSON.parse(localStorage.getItem('ftState') || '{}'); } catch(e) { state = {}; }
            state.command = cmd;
            localStorage.setItem('ftPopupCommand', JSON.stringify(state));
        }
    }

    function updatePopupDisplay() {
        var active = document.getElementById('popup-active');
        var idle = document.getElementById('popup-idle');
        var playBtn = document.getElementById('popup-play');
        var pauseBtn = document.getElementById('popup-pause');
        var status = document.getElementById('popup-status');

        if (popupSeconds > 0 || popupRunning) {
            active.style.display = 'block';
            idle.style.display = 'none';

            var h = Math.floor(popupSeconds / 3600);
            var m = Math.floor((popupSeconds % 3600) / 60);
            var s = popupSeconds % 60;
            document.getElementById('popup-time').textContent =
                String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            document.getElementById('popup-subject').textContent = popupSubject || 'Geral';

            if (popupRunning) {
                status.textContent = 'Estudando...';
                status.className = 'popup-status running';
                playBtn.style.display = 'none';
                pauseBtn.style.display = 'flex';
            } else {
                status.textContent = 'Pausado';
                status.className = 'popup-status paused';
                playBtn.style.display = 'flex';
                pauseBtn.style.display = 'none';
            }
        } else {
            active.style.display = 'none';
            idle.style.display = 'block';
        }
    }

    function syncFromLocalStorage() {
        var state = {};
        try { state = JSON.parse(localStorage.getItem('ftState') || '{}'); } catch(e) { state = {}; }
        if (state.seconds !== undefined) {
            popupSeconds = state.seconds || 0;
            popupRunning = state.running || false;
            popupSubject = state.subject || '';
            popupStartTime = state.startTime || 0;
            if (popupRunning && popupStartTime > 0) {
                popupSeconds = popupCalcSeconds();
                popupStartLoop();
            } else {
                popupStopLoop();
            }
            updatePopupDisplay();
        }
    }

    window.addEventListener('storage', function(e) {
        if (e.key === 'ftState') {
            syncFromLocalStorage();
        }
    });

    syncFromLocalStorage();

    window.addEventListener('beforeunload', function() {
        popupStopLoop();
        if (channel) {
            channel.close();
            channel = null;
        }
    });
    </script>
</body>
</html>
